# requirements-phase-map.yaml — Map REQ → Phase
# Verifier dùng file này để biết check REQ nào sau mỗi phase
# Lưu ý: run_phase.py chỉ chạy REQ method "command" per-phase;
# các artifact methods chạy ở Phase 6/7 (final verify).

phase_requirements:
  phase0_sponsor:
    reqs: [REQ-001, REQ-002, REQ-053, REQ-066]
    description: "Sponsor package detection + audit opinion + API fallback log"

  phase1_data:
    reqs: [REQ-003, REQ-004, REQ-032, REQ-052, REQ-059, REQ-062, REQ-067]
    description: "Data collection + split audit + peer provenance + liquidity + data provenance + period integrity + fiscal year"

  phase2_fundamental:
    reqs: [REQ-061, REQ-064]
    description: "Fundamental analysis (derived metrics recompute, trend consistency)"

  phase3_valuation:
    reqs: [REQ-016, REQ-025, REQ-060, REQ-063, REQ-065, REQ-069]
    description: "Valuation (sanity, PE/PB recompute, cross-footing, methods completeness, verdict tone)"

  phase4a_tech_active:
    reqs: [REQ-005, REQ-037, REQ-046, REQ-058]
    description: "Technical mode ACTIVE (Tech Score, Verdict, indicator verify, S/R method)"

  phase4b_tech_profile:
    reqs: [REQ-006, REQ-007]
    description: "Technical mode PROFILE (non-advice)"

  phase5_news:
    reqs: [REQ-008, REQ-041, REQ-044]
    description: "News digest + sentiment + 30-day window + authenticity"

  phase6_dashboard:
    reqs: [REQ-009, REQ-010, REQ-011, REQ-012, REQ-013, REQ-014, REQ-015, REQ-017, REQ-018, REQ-019, REQ-020, REQ-022, REQ-023, REQ-024, REQ-026, REQ-027, REQ-028, REQ-029, REQ-030, REQ-031, REQ-033, REQ-034, REQ-035, REQ-036, REQ-038, REQ-039, REQ-040, REQ-042, REQ-043, REQ-045, REQ-047, REQ-048, REQ-049, REQ-050, REQ-051, REQ-054, REQ-055, REQ-056, REQ-057, REQ-060, REQ-061, REQ-063, REQ-064, REQ-065, REQ-069, REQ-070, REQ-071, REQ-072, REQ-073, REQ-074, REQ-075, REQ-076]
    description: "Dashboard build (structure + content + data accuracy + consistency + provenance + narrative quality) — FIX-2: bổ sung REQ-022/023/024/026/027 (data accuracy) trước đây unmapped"

  phase7_deploy:
    reqs: [REQ-021, REQ-068]
    description: "Final verify + deploy (P3: REQ-068 phase_completion_check — mọi phase 0-6 phải completed)"
